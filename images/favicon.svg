<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#ff477e"/>
      <stop offset="100%" stop-color="#d61c56"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="50%" stop-color="#f5c242"/>
      <stop offset="100%" stop-color="#d49413"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#a81944" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Glowing Heart -->
  <path d="M32 56 C32 56 8 41 8 23 C8 13.5 15.5 7 24 7 C28.5 7 31 9.5 32 11.5 C33 9.5 35.5 7 40 7 C48.5 7 56 13.5 56 23 C56 41 32 56 32 56 Z"
        fill="url(#heartGrad)"
        filter="url(#softGlow)"/>

  <!-- Golden Princess Tiara / Crown -->
  <path d="M20 18 L24 7 L32 13 L40 7 L44 18 Z"
        fill="url(#crownGrad)"/>
  
  <!-- Crown Pearls -->
  <circle cx="24" cy="6.5" r="2.2" fill="#ffffff" stroke="#c48a10" stroke-width="0.8"/>
  <circle cx="32" cy="12" r="2.6" fill="#ffffff" stroke="#c48a10" stroke-width="0.8"/>
  <circle cx="40" cy="6.5" r="2.2" fill="#ffffff" stroke="#c48a10" stroke-width="0.8"/>
  
  <!-- Tiara Band Pearls -->
  <circle cx="26" cy="18" r="1.4" fill="#ffffff"/>
  <circle cx="32" cy="18" r="1.6" fill="#ffffff"/>
  <circle cx="38" cy="18" r="1.4" fill="#ffffff"/>

  <!-- Shimmer Highlights -->
  <ellipse cx="20" cy="22" rx="4" ry="7" transform="rotate(-30 20 22)" fill="#ffffff" opacity="0.4"/>
  <circle cx="44" cy="28" r="2" fill="#ffffff" opacity="0.6"/>
  <polygon points="46,14 47.5,17 50.5,18.5 47.5,20 46,23 44.5,20 41.5,18.5 44.5,17" fill="#ffffff" opacity="0.95"/>
</svg>
